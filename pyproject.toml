[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alexabench-lite"
version = "0.1.0"
description = "Reproducible English-Hindi speech and assistant evaluation"
requires-python = ">=3.11,<3.12"
dependencies = ["faster-whisper==1.2.1"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
alexabench = "alexabench.cli:main"

[tool.setuptools.packages.find]
include = ["alexabench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
